<title>Manipulador de evento</title>

<body>
<h1>Manipulador de evento</h1>
<p>A imagem que falta dispara o <code>onerror</code>.</p>
<p><img src="../Images/nao_existe.png" alt="falta" onerror="document.documentElement.setAttribute('data-hostil', 'onerror')"/></p>
</body>
